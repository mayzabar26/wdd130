<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Exercise</title>
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>League</th>
                <th>Team</th>
                <th>Record</th>
                <th>Player Count</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2">Southern</th>
                <td>Parana</td>
                <td>52-19</td>
                <td>23</td>
            </tr>

            <tr>
                <td class="grey">Catarina</td>
                <td class="grey">49-24</td>
                <td class="grey">10</td>
            </tr>

            <tr>
                <th rowspan="3">Western</th>
                <td>Lacerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>

            <tr>
                <td class="grey">Acre</td>
                <td class="grey">75-87</td>
                <td class="grey">20</td>
            </tr>

            <tr>
                <td>Rondonia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total Players</td>
                <td>92</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
