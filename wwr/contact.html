<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with our whitewater rafting team. Contact us with your questions, book your next adventure, or learn more about our guided rafting trips and services.">
    <meta name="author" content="Mayza Costa Barbosa">
    <title>Contact Us</title>
    
    <!--CSS-->
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="logo-wwr" src="images/wwr-logo-oficial.webp" alt="RiverJoy Rafting Adventures" width="250">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="address">
           <h1>RiverJoy Rafting Adventures</h1>
           <p class="add-info">
             321 River Run RD
             <br>Buena Vista, USA
             <br>(719) 555-0147
             <br>riverjoy@gmail.com
            </p> 
        </div>
        
        <section class="location">
            <img class="localimg" src="images/location.webp" alt="RiverJoy Company Location">
        </section>

        <section class="form">
            <form>
                <div class="form-group">
                    <!--Name information-->
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder" required>
                </div>
                
                <div class="form-group">
                    <!--Email information-->
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div class="form-group">
                
                <div class="form-group">
                    <!--Radio form option-->
                    <p class="radioform">Message Purpose:</p>

                    <input type="radio" id="purpose" name="message" value="generalmessage">
                    <label for="generalmessage">General Inquiry</label>   
                
                    <input type="radio" id="reservationmessage" name="message" value="reservationmessage">
                    <label for="reservationmessage">Reservation Question</label>

                    <input type="radio" id="suggestionmessage" name="message" value="suggestionmessage">
                    <label for="suggestionmessage">Website Suggestion</label>
                </div>
                
                <div class="form-group">
                    <!--Write the message-->
                    <label for="message">Write down your message</label>
                    <textarea id="q2" name="q2" rows="4"></textarea>
                </div>
                


            </form>

        </section>

        <section class="sec-adv">
            <h2 class="adventure">We Are Here to Serve You</h2>

            <figure>
                <img class="img-cards" src="images/employee01.webp" alt="Employee Profile Picture">
                <figcaption>Vanessa Kirk</figcaption>
            </figure>
            
            <figure>
                <img class="img-cards" src="images/employee02.webp" alt="Employee Profile Picture">
                <figcaption>Zack Miller</figcaption>
            </figure>
            
            <figure>
                <img class="img-cards" src="images/employee03.webp" alt="Employee Profile Picture">
                <figcaption>Madelaine Andrews</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>©2026 | RiverJoy Rafting Adventures | Mayza Barbosa</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/icon-facebook.png" alt="Facebook Icon">
            </a>

            <a href="https://www.instagram.com">
                <img src="images/instagram-icon.png" alt="Instagram Icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin-icon.png" alt="LinkedIn Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
