<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with our whitewater rafting team. Contact us with your questions, reservations, or learn more about our services.">
    <meta name="author" content="Mayza Costa Barbosa">
    <title>Contact Us</title>
    
    <!--CSS-->
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="logo-wwr" src="images/wwr-logo-oficial.webp" alt="RiverJoy Rafting Adventures" width="250">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <section class="address">
            <h2>RiverJoy Rafting Adventures</h2>
            <p class="add-info">
                321 River Run RD
                <br>Buena Vista, USA
                <br>(719) 555-0147
                <br>riverjoy@gmail.com
            </p>
        </section>

        <section class="contactus">
            <section class="location">
                <img class="localimg" src="images/location.webp" alt="RiverJoy Company Location">
            </section>
            
            <section class="form">
                <form>
                    <!--Full Name-->
                    <div class="form-row">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Placeholder" required>
                    </div>
                    
                    <!--Email-->
                    <div class="form-row">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder" required>
                    </div>
                    
                    <!--Message Purpose-->
                    <div class="form-row">
                        <p class="radio-title">Message Purpose:</p>
                    
                        <div class="radio-options">
                    
                            <label>
                                <input type="radio"  id="general" name="purpose" value="general" checked>
                                General Inquiry
                            </label>
                    
                            <label>
                                <input type="radio"  id="reservation" name="purpose" value="reservation">
                                Reservation Question
                            </label>
                    
                            <label>
                                <input type="radio"  id="suggestion" name="purpose" value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>
                    
                    <!--Message-->
                    <div class="message-group">
                        <label for="message">Write your message</label>
                        <textarea id="message" name="message" rows="3" placeholder="Type here..."></textarea>
                    </div>
                    
                    <!--Newsletter-->
                    <div class="newsletter">
                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter">Please subscribe me to the monthly newsletter
                        </label>
                    </div>
                    
                    <!--Button-->
                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </section>
        
        <section class="sec-adv">
            <h2 class="adventure">We Are Here to Serve You</h2>

            <figure>
                <img class="img-cards" src="images/employee01.webp" alt="Employee Profile Picture">
                <figcaption>Vanessa Kirk</figcaption>
            </figure>
            
            <figure>
                <img class="img-cards" src="images/employee02.webp" alt="Employee Profile Picture">
                <figcaption>Zack Miller</figcaption>
            </figure>
            
            <figure>
                <img class="img-cards" src="images/employee03.webp" alt="Employee Profile Picture">
                <figcaption>Madelaine Andrews</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>©2026 | RiverJoy Rafting Adventures | Mayza Barbosa</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/icon-facebook.png" alt="Facebook Icon">
            </a>

            <a href="https://www.instagram.com">
                <img src="images/instagram-icon.png" alt="Instagram Icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin-icon.png" alt="LinkedIn Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
